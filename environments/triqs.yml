name: kernelgecp-triqs
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  - triqs=4.0.2
  - triqs_cthyb=4.0.1
  - numpy=2.2.6
  - scipy=1.18.1
  - matplotlib-base=3.11.2
  - mpmath=1.3.0
  - threadpoolctl=3.6.0
  - pip
  - pip:
      - "triqs-maxent @ https://files.pythonhosted.org/packages/e3/39/5d66340abc22e6b88fcc54763ead8ca34f06363ef1700247d46705238bcd/triqs_maxent-4.0.1-py3-none-any.whl#sha256=74c0fb1a4ec4abbc0ee8b46d11f9f01781687d4bfbe74982c0100c0887b4fcac"
variables:
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  VECLIB_MAXIMUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  BLIS_NUM_THREADS: "1"
