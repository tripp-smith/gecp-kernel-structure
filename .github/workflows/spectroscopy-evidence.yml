name: Spectroscopy evidence replay

on:
  push:
    branches: [main, "codex/phase-eh-covariance-maxent"]
  pull_request:
  workflow_dispatch:
    inputs:
      science_revision:
        description: Frozen science commit for preflight
        required: false
        type: string
      run_id:
        description: Canonical v4 run ID for preflight
        required: false
        type: string
      historical_replay:
        description: Also rerun the archived v1 numerical audit
        type: boolean
        default: false

permissions:
  contents: read

env:
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  VECLIB_MAXIMUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  BLIS_NUM_THREADS: "1"

jobs:
  historical-archive-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify retained historical archive bytes
        run: |
          python - <<'PY'
          from experiments.replay_spectroscopy_acceptance import ARCHIVES, ROOT, verified_archives

          for name in sorted(verified_archives(ROOT)):
              print(f"{name} {ARCHIVES[name]}")
          PY

  historical-replay:
    if: github.event_name == 'workflow_dispatch' && inputs.historical_replay
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2f2446c60a1dbdd54db2727960befbf5153b55d3
          fetch-depth: 0
          persist-credentials: false
      - uses: mamba-org/setup-micromamba@v2
        with:
          micromamba-version: "2.9.0-0"
          environment-file: environments/locks/triqs-linux-64-conda-explicit.txt
          environment-name: kernelgecp-maxent
          cache-environment: true
          post-cleanup: all
      - name: Install pinned scientific providers
        run: |
          python -m pip install --no-deps --require-hashes -r environments/locks/triqs-maxent-pip.txt
          python -m pip install --no-deps --require-hashes -r environments/locks/dlr-physics-pip.txt
          python -c 'from triqs_maxent import TauMaxEnt; import triqs_cthyb, pydlr, sparse_ir'
      - name: Replay independent scientific audits
        run: |
          mkdir -p artifacts
          python -m experiments.replay_spectroscopy_acceptance --output artifacts/spectroscopy-replay.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spectroscopy-historical-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/spectroscopy-replay.json
            artifacts/spectroscopy-replay.json.logs/
          if-no-files-found: error

  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: mamba-org/setup-micromamba@v2
        with:
          micromamba-version: "2.9.0-0"
          environment-file: environments/locks/triqs-linux-64-conda-explicit.txt
          environment-name: kernelgecp-maxent
          cache-environment: true
          post-cleanup: all
      - name: Install pinned scientific providers
        run: |
          python -m pip install --no-deps --require-hashes -r environments/locks/triqs-maxent-pip.txt
          python -m pip install --no-deps --require-hashes -r environments/locks/dlr-physics-pip.txt
          python -c 'from triqs_maxent import TauMaxEnt; import triqs_cthyb, pydlr, sparse_ir'
      - name: Replay independent scientific audits
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ github.event.pull_request.head.sha || github.sha }}
          SCIENCE_REVISION: ${{ inputs.science_revision }}
          ORIGIN_RUN_ID: ${{ inputs.run_id }}
        run: |
          args=()
          if [[ -n "$SCIENCE_REVISION" || -n "$ORIGIN_RUN_ID" ]]; then
            [[ "${{ github.event_name }}" == workflow_dispatch && -n "$SCIENCE_REVISION" && -n "$ORIGIN_RUN_ID" ]]
            args=(--science-revision "$SCIENCE_REVISION" --run-id "$ORIGIN_RUN_ID")
          fi
          python -m scripts.release_spectroscopy_replay --candidate "$CANDIDATE" \
            --python "$(command -v python)" --output "$RUNNER_TEMP/spectroscopy-v4-replay" "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spectroscopy-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/spectroscopy-v4-replay/origin.json
            ${{ runner.temp }}/spectroscopy-v4-replay/equivalence.json
            ${{ runner.temp }}/spectroscopy-v4-replay/download.log
            ${{ runner.temp }}/spectroscopy-v4-replay/audit/
          if-no-files-found: error
