name: Spectroscopy evidence replay

on:
  push:
    branches: [main, "codex/phase-eh-covariance-maxent"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  VECLIB_MAXIMUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  BLIS_NUM_THREADS: "1"

jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: mamba-org/setup-micromamba@v2
        with:
          micromamba-version: "2.9.0-0"
          environment-file: environments/locks/triqs-linux-64-conda-explicit.txt
          environment-name: kernelgecp-maxent
          cache-environment: true
          post-cleanup: all
      - name: Install pinned scientific providers
        run: |
          python -m pip install --no-deps --require-hashes -r environments/locks/triqs-maxent-pip.txt
          python -m pip install --no-deps --require-hashes -r environments/locks/dlr-physics-pip.txt
          python -c 'from triqs_maxent import TauMaxEnt; import triqs_cthyb, pydlr, sparse_ir'
      - name: Replay independent scientific audits
        run: |
          mkdir -p artifacts
          python -m experiments.replay_spectroscopy_acceptance --output artifacts/spectroscopy-replay.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spectroscopy-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: error
