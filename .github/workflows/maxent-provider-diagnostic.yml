name: MaxEnt Linux calibration diagnostic

on:
  workflow_dispatch:
  push:
    branches: ["codex/eh-provider-diagnostic"]
    paths: [.github/workflows/maxent-provider-diagnostic.yml]

permissions:
  contents: read

env:
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  VECLIB_MAXIMUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  BLIS_NUM_THREADS: "1"

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: mamba-org/setup-micromamba@v2
        with:
          micromamba-version: "2.9.0-0"
          environment-file: environments/locks/triqs-linux-64-conda-explicit.txt
          environment-name: kernelgecp-maxent
          cache-environment: true
          post-cleanup: all
      - name: Require the same pinned actual scientific runtime
        run: |
          python -m pip install --no-deps --require-hashes -r environments/locks/triqs-maxent-pip.txt
          python -m pip install --no-deps --require-hashes -r environments/locks/dlr-physics-pip.txt
          python -c 'from triqs_maxent import TauMaxEnt; import pydlr, sparse_ir'
      - name: Repeat only the consumed calibration case with full exception chaining
        run: |
          mkdir -p artifacts
          python - <<'PYDIAG'
          from pathlib import Path
          import json
          from experiments import spectroscopy as science
          from kernelgecp.integrations.maxent import save_spectral_dataset
          # Instrument serialization only; preserve the complete provider,
          # selector, alpha grid, covariance and original calibration sample.
          actual = science.continue_tau_maxent
          def capture_training(data, config):
              save_spectral_dataset(data, Path("artifacts/provider-training.npz"),
                  units={"tau":"inverse_energy", "omega":"energy", "G_tau":"dimensionless"},
                  provider={"name":"diagnostic-capture-before-actual-TauMaxEnt"},
                  calculation_settings={"case":"offgrid_atoms_correlated", "method":"pydlr", "seed":102})
              return actual(data, config)
          science.continue_tau_maxent = capture_training
          Path("artifacts/scope.json").write_text(json.dumps({
              "scope":"Training-only replay of the failed Linux calibration; no new final samples or accepted scientific result.",
              "baseline_source_revision":"1452a8a921c650242f0ba1fae5593cc67f314bf1",
              "provenance":science.provenance()}, indent=2)+"\n")
          # Calling run_case directly preserves the chained native exception.
          science.run_case("offgrid_atoms_correlated", "pydlr", 102, 1e-8,
              {"default_model":"broad_gaussian", "n_omega":401, "n_alpha":33},
              Path("artifacts/diagnostic-case.json"), pilot=True, bootstrap=0, query_order=24)
          PYDIAG
      - name: Record dependency versions even on failure
        if: always()
        run: python -m pip freeze --all > artifacts/pip-freeze.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maxent-linux-provider-diagnostic
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
