name: Fixed-bath acquisition segment

on:
  workflow_call:
    inputs:
      segment:
        type: string
        required: true
      previous:
        type: string
        required: true
      max_new:
        type: number
        required: true
      expected:
        type: number
        required: true

permissions:
  contents: read
  actions: read

env:
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  VECLIB_MAXIMUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  BLIS_NUM_THREADS: "1"

jobs:
  acquire:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - name: Refuse regeneration through workflow reruns
        env:
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          test "$RUN_ATTEMPT" = 1 || { echo 'Acquisition reruns are forbidden; preserve and inspect the first attempt.' >&2; exit 1; }
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: mamba-org/setup-micromamba@v2
        with:
          micromamba-version: "2.9.0-0"
          environment-file: environments/locks/triqs-linux-64-conda-explicit.txt
          environment-name: kernelgecp-maxent
          cache-environment: true
          post-cleanup: all
      - name: Require the pinned actual scientific runtime
        run: |
          python -m pip install --no-deps --require-hashes -r environments/locks/triqs-maxent-pip.txt
          python -m pip install --no-deps --require-hashes -r environments/locks/dlr-physics-pip.txt
          python -m pip install pytest==9.0.3
          python -c 'from triqs_maxent import TauMaxEnt; import triqs_cthyb, pydlr, sparse_ir'
      - uses: actions/download-artifact@v4
        with:
          name: maxent-calibration-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts
      - uses: actions/download-artifact@v4
        if: inputs.previous != ''
        with:
          name: fixed-bath-${{ inputs.previous }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/fixed-bath
      - name: Extract the hash-bound accepted parent
        run: |
          python - <<'PYEXTRACT'
          from pathlib import Path
          from experiments.replay_cthyb_acceptance import extract, digest, ZIP_SHA, BINDING_SHA
          archive = Path('experiments/data/cthyb-linux-7200ec0-passed.zip')
          binding = Path('data/cthyb/linux-audit-binding-7200ec0.json')
          assert digest(archive) == ZIP_SHA and digest(binding) == BINDING_SHA
          extract(archive, Path('artifacts/parent'))
          PYEXTRACT
      - name: Verify disposable Linux native runtime wiring
        if: inputs.segment == 'a'
        run: |
          python -m pytest tests/test_cthyb_fixed_bath.py::test_linux_native_runtime_freeze_survives_first_solve -o addopts= -q --junitxml=/tmp/fixed-bath-preflight.xml
          python - <<'PYPREFLIGHT'
          import xml.etree.ElementTree as ET
          cases = ET.parse('/tmp/fixed-bath-preflight.xml').getroot().findall('.//testcase')
          assert len(cases) == 1
          assert cases[0].get('name') == 'test_linux_native_runtime_freeze_survives_first_solve'
          assert all(cases[0].find(kind) is None for kind in ('skipped', 'failure', 'error'))
          PYPREFLIGHT
      - name: Freeze once and run the bounded segment
        env:
          SEGMENT: ${{ inputs.segment }}
          MAX_NEW: ${{ inputs.max_new }}
          EXPECTED: ${{ inputs.expected }}
        run: |
          calibration_hash=$(sha256sum artifacts/native-calibration/calibration.json | cut -d ' ' -f1)
          calibration_audit_hash=$(sha256sum artifacts/native-calibration-audit.json | cut -d ' ' -f1)
          args=(--parent artifacts/parent --binding data/cthyb/linux-audit-binding-7200ec0.json
            --output artifacts/fixed-bath --calibration artifacts/native-calibration/calibration.json
            --calibration-sha256 "$calibration_hash" --calibration-audit artifacts/native-calibration-audit.json
            --calibration-audit-sha256 "$calibration_audit_hash")
          if [[ "$SEGMENT" == a ]]; then
            python -m experiments.cthyb_fixed_bath "${args[@]}" freeze
          fi
          python -m experiments.cthyb_fixed_bath "${args[@]}" acquire --max-new-chains "$MAX_NEW"
          python - <<'PYCHECK'
          import json, os
          from pathlib import Path
          result = json.loads(Path('artifacts/fixed-bath/result.json').read_text())
          assert len(result['chains']) == int(os.environ['EXPECTED']), 'segment incomplete; preserve checkpoint and stop'
          PYCHECK
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fixed-bath-${{ inputs.segment }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/fixed-bath/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
