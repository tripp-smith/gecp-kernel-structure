name: Production provider runtimes

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: providers-${{ github.ref }}
  cancel-in-progress: true

env:
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  VECLIB_MAXIMUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  BLIS_NUM_THREADS: "1"

jobs:
  triqs:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-64
          - os: macos-15
            platform: osx-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: mamba-org/setup-micromamba@v2
        with:
          micromamba-version: "2.9.0-0"
          environment-file: environments/locks/triqs-${{ matrix.platform }}-conda-explicit.txt
          environment-name: kernelgecp-triqs
          cache-environment: true
          post-cleanup: all
      - name: Install the separately hash-locked MaxEnt provider
        run: >-
          python -m pip install --no-deps --require-hashes
          -r environments/locks/triqs-maxent-pip.txt
      - name: Execute actual TRIQS, CT-HYB and MaxEnt calculations
        run: |
          mkdir -p artifacts
          python scripts/providers/triqs_smoke.py --output artifacts/triqs.json \
            --source-revision "$(git rev-parse HEAD)"
          python scripts/providers/verify_receipt.py artifacts/triqs.json \
            --provider triqs --source-revision "$(git rev-parse HEAD)"
      - name: Record actually executed runtime locks
        run: |
          python scripts/providers/export_conda_lock.py \
            --explicit artifacts/triqs-conda-explicit.txt \
            --inventory artifacts/triqs-conda-inventory.json
          python -m pip freeze --all > artifacts/triqs-pip-freeze.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: provider-triqs-${{ matrix.os }}
          path: artifacts/
          if-no-files-found: error

  gp:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.5"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: environments/gp/uv.lock
      - name: Install hash-locked CPU provider environment
        run: uv sync --project environments/gp --frozen
      - name: Execute real operator solves and Gaussian probability checks
        run: |
          uv run --project environments/gp --frozen python scripts/providers/gp_smoke.py \
            --output artifacts/gp.json --source-revision "$(git rev-parse HEAD)"
          python scripts/providers/verify_receipt.py artifacts/gp.json \
            --provider gp --source-revision "$(git rev-parse HEAD)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: provider-gp-${{ matrix.os }}
          path: artifacts/
          if-no-files-found: error

  native:
    strategy:
      fail-fast: false
      matrix:
        provider: [green, epw]
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: docker/setup-buildx-action@v3
      - name: Build pinned CPU native provider
        uses: docker/build-push-action@v6
        with:
          context: .
          file: environments/${{ matrix.provider }}/Dockerfile
          tags: kernelgecp-${{ matrix.provider }}:runtime
          load: true
          push: false
          cache-from: type=gha,scope=provider-${{ matrix.provider }}
          cache-to: type=gha,mode=min,scope=provider-${{ matrix.provider }}
      - name: Execute native numerical calculation and validate receipt
        env:
          PROVIDER: ${{ matrix.provider }}
        run: |
          mkdir -p artifacts
          docker image inspect "kernelgecp-$PROVIDER:runtime" \
            --format '{{.Id}}' > "artifacts/$PROVIDER-image-id.txt"
          docker run --rm -e OMP_NUM_THREADS=1 -e OPENBLAS_NUM_THREADS=1 \
            -e MKL_NUM_THREADS=1 -v "$PWD/artifacts:/artifacts" \
            "kernelgecp-$PROVIDER:runtime" \
            /opt/venv/bin/python "/workspace/scripts/providers/${PROVIDER}_smoke.py" \
            --output "/artifacts/$PROVIDER.json" \
            --source-revision "$(git rev-parse HEAD)"
          python scripts/providers/verify_receipt.py "artifacts/$PROVIDER.json" \
            --provider "$PROVIDER" --source-revision "$(git rev-parse HEAD)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: provider-${{ matrix.provider }}-linux
          path: artifacts/
          if-no-files-found: error
