name: CT-HYB frozen evidence replay

on:
  push:
    branches: ['main', 'codex/phase-ee-cthyb-dmft']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  VECLIB_MAXIMUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  BLIS_NUM_THREADS: '1'

jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: mamba-org/setup-micromamba@v2
        with:
          micromamba-version: '2.9.0-0'
          environment-file: environments/locks/triqs-linux-64-conda-explicit.txt
          environment-name: kernelgecp-triqs
          cache-environment: true
          post-cleanup: all
      - name: Install locked providers
        run: |
          python -m pip install --no-deps --require-hashes -r environments/locks/dlr-physics-pip.txt
          python -m pip install --no-deps .
      - name: Recompute independent audit from committed native data
        run: python -m experiments.replay_cthyb_acceptance --output artifacts/cthyb-evidence-replay.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cthyb-evidence-replay-${{ github.run_id }}
          path: artifacts/cthyb-evidence-replay.json
          if-no-files-found: warn
          retention-days: 30
