name: Optional native backend

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  source-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: dtolnay/rust-toolchain@1.92.0
      - run: uv sync --all-extras --frozen
      - name: Vendor exact dependencies and prepare inspected source/notices
        shell: bash
        run: |
          cargo vendor --manifest-path native/Cargo.toml --locked --versioned-dirs "$RUNNER_TEMP/native-vendor"
          uv run --all-extras --frozen python scripts/prepare_corresponding_source.py build \
            --project-root . --revision "$GITHUB_SHA" \
            --vendor "$RUNNER_TEMP/native-vendor" --output "$RUNNER_TEMP/source-assets" \
            --report "$RUNNER_TEMP/source-assets/source-report.json"
      - name: Build portable wheel and source distribution
        run: uv build --no-sources --out-dir pure-dist
      - name: Inspect portable distribution including native source inputs
        run: >-
          uv run --all-extras --frozen python scripts/check_distribution.py inspect
          --project-root . --wheel pure-dist/*.whl --sdist pure-dist/*.tar.gz
      - name: Rebuild and inspect a validation wheel from the original sdist
        run: |
          uv build pure-dist/*.tar.gz --wheel --no-sources --out-dir sdist-wheel
          uv run --all-extras --frozen python scripts/check_distribution.py inspect \
            --project-root . --wheel sdist-wheel/*.whl --sdist pure-dist/*.tar.gz
      - name: Stage the original candidates and separate validation artifact
        run: |
          mkdir -p "$RUNNER_TEMP/release-source/source" "$RUNNER_TEMP/release-source/dist" \
            "$RUNNER_TEMP/release-source/validation/sdist-wheel"
          cp "$RUNNER_TEMP/source-assets/"* "$RUNNER_TEMP/release-source/source/"
          cp pure-dist/*.whl pure-dist/*.tar.gz "$RUNNER_TEMP/release-source/dist/"
          cp sdist-wheel/*.whl "$RUNNER_TEMP/release-source/validation/sdist-wheel/"
      - uses: actions/upload-artifact@v4
        with:
          name: kernelgecp-release-source
          path: ${{ runner.temp }}/release-source/
          if-no-files-found: error

  portable-install:
    needs: source-assets
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: kernelgecp-release-source
          path: ${{ runner.temp }}/release-source
      - name: Install both exact portable artifacts outside checkout
        run: |
          portable_index=0
          for candidate in dist validation/sdist-wheel; do
            portable_env="$RUNNER_TEMP/portable-install-$portable_index"
            uv venv "$portable_env"
            uv pip install --python "$portable_env" \
              "$RUNNER_TEMP/release-source/$candidate/"*.whl "mypy>=1.11,<2"
            (
              cd "$RUNNER_TEMP"
              uv run --no-project --python "$portable_env" python -I \
                "$GITHUB_WORKSPACE/scripts/check_distribution.py" installed \
                --project-root "$GITHUB_WORKSPACE" --backend python
              uv run --no-project --python "$portable_env" python -I -c \
                'import importlib.util; assert importlib.util.find_spec("kernelgecp._native") is None'
            )
            portable_index=$((portable_index + 1))
          done

  rust-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: dtolnay/rust-toolchain@1.92.0
      - run: uv sync --all-extras --frozen
      - name: Rust format, lint and native state/export tests
        shell: bash
        run: |
          export PYO3_PYTHON="$(uv python find)"
          cargo fmt --manifest-path native/Cargo.toml --check
          cargo clippy --manifest-path native/Cargo.toml --locked --all-targets -- -D warnings
          cargo test --manifest-path native/Cargo.toml --locked

  wheel:
    needs: source-assets
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: dtolnay/rust-toolchain@1.92.0
      - run: uv sync --all-extras --frozen
      - uses: actions/download-artifact@v4
        with:
          name: kernelgecp-release-source
          path: ${{ runner.temp }}/native-input
      - name: Locate source report and sdist
        run: |
          native_version="$(uv run --all-extras --frozen python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          native_report="$RUNNER_TEMP/native-input/source/source-report.json"
          native_sdist="$RUNNER_TEMP/native-input/dist/kernelgecp-$native_version.tar.gz"
          test -f "$native_report" && test -f "$native_sdist"
          echo "NATIVE_SOURCE_REPORT=$native_report" >> "$GITHUB_ENV"
          echo "NATIVE_SDIST=$native_sdist" >> "$GITHUB_ENV"
      - name: Build Linux wheel in the manylinux 2.28 environment
        if: runner.os == 'Linux'
        run: |
          mkdir -p "$RUNNER_TEMP/native-wheel"
          native_assets="$(dirname "$NATIVE_SOURCE_REPORT")"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work:ro" -v "$native_assets:/source-assets:ro" \
            -v "$RUNNER_TEMP/native-wheel:/output" \
            -v "$HOME/.cargo:/cargo" -v "$HOME/.rustup:/rustup:ro" \
            -e CARGO_HOME=/cargo -e RUSTUP_HOME=/rustup -e RUSTUP_TOOLCHAIN=1.92.0 \
            -e PYO3_PYTHON=/opt/python/cp312-cp312/bin/python \
            -w /work quay.io/pypa/manylinux_2_28_x86_64:latest \
            bash -euxc '
              export PATH=/cargo/bin:/opt/python/cp312-cp312/bin:$PATH
              git config --global --add safe.directory /work
              python -m pip install "maturin==1.15.0" "packaging>=24.2,<27"
              python scripts/build_native_wheel.py --project-root /work \
                --source-report /source-assets/source-report.json --output /output \
                --compatibility manylinux_2_28
            '
      - name: Build macOS wheel
        if: runner.os == 'macOS'
        run: >-
          uv run --all-extras --frozen python scripts/build_native_wheel.py --project-root .
          --source-report "$NATIVE_SOURCE_REPORT" --output "$RUNNER_TEMP/native-wheel"
      - name: Inspect native wheel, source identity, licenses and dependency inventory
        run: >-
          uv run --all-extras --frozen python scripts/check_distribution.py inspect --kind native
          --project-root . --wheel "$RUNNER_TEMP/native-wheel/"*.whl --sdist "$NATIVE_SDIST"
      - name: Install native wheel outside checkout on both supported interpreters
        run: |
          for native_python in 3.12 3.13; do
            native_env="$RUNNER_TEMP/native-install-$native_python"
            uv venv --python "$native_python" "$native_env"
            uv pip install --python "$native_env" "$RUNNER_TEMP/native-wheel/"*.whl "mypy>=1.11,<2" "pytest>=9,<10"
            (
              cd "$RUNNER_TEMP"
              for native_backend in python rust; do
                uv run --no-project --python "$native_env" python -I \
                  "$GITHUB_WORKSPACE/scripts/check_distribution.py" installed \
                  --project-root "$GITHUB_WORKSPACE" --backend "$native_backend"
              done
              uv run --no-project --python "$native_env" python -I -m pytest \
                --import-mode=importlib "$GITHUB_WORKSPACE/tests/test_native_backend.py" \
                "$GITHUB_WORKSPACE/tests/test_reference_backend.py"
            )
          done
      - uses: actions/upload-artifact@v4
        with:
          name: kernelgecp-release-native-${{ matrix.platform }}
          path: ${{ runner.temp }}/native-wheel/*.whl
          if-no-files-found: error
