[project]
name = "kernelgecp"
version = "1.1.0"
description = "Reusable fermionic cross bases, precision diagnostics, and optional native evaluation"
readme = "PACKAGE_README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
  "mpmath>=1.3,<2",
  "numpy>=2.0,<3",
  "scipy>=1.15,<2",
]

[project.urls]
Repository = "https://github.com/tripp-smith/gecp-kernel-structure"
Documentation = "https://github.com/tripp-smith/gecp-kernel-structure/blob/main/APPLICATION.md"
Methods = "https://github.com/tripp-smith/gecp-kernel-structure/blob/main/METHODS.md"
Issues = "https://github.com/tripp-smith/gecp-kernel-structure/issues"

[project.optional-dependencies]
plot = ["matplotlib>=3.9,<4"]
dev = [
  "hypothesis>=6.100,<7",
  "mypy>=1.11,<2",
  "pip-audit>=2.7,<3",
  "filelock>=4.2.1,<5",
  "pytest>=9.0.3,<10",
  "ruff>=0.6,<1",
  "maturin==1.15.0",
  "packaging>=24.2,<27",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build]
exclude = [
  "/autonomous-implementation.md",
  "/FINDINGS 2.md",
  "/MATHLIB 2.md",
  "/kernelgecp/*.so",
  "/kernelgecp/*.pyd",
  "/kernelgecp/*.dylib",
  "/native/target",
  "/native/vendor",
]

[tool.hatch.build.targets.wheel]
packages = ["kernelgecp"]

[tool.hatch.build.targets.sdist]
include = [
  "/kernelgecp", "/pyproject.toml", "/APPLICATION.md", "/README.md", "/LICENSE",
  "/native", "/rust-toolchain.toml",
  "/PACKAGE_README.md", "/METHODS.md", "/CITATION.cff", "/RELEASE_NOTES.md",
]

[tool.maturin]
manifest-path = "native/Cargo.toml"
module-name = "kernelgecp._native"
python-source = "."
bindings = "pyo3"
features = ["extension-module"]
locked = true
strip = true

[tool.maturin.sbom]
# The native builder supplies an audited, deterministic dependency inventory.
rust = false
auditwheel = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["kernelgecp"]

[[tool.mypy.overrides]]
module = ["mpmath", "scipy.*"]
ignore_missing_imports = true
