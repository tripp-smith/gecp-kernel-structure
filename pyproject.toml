[project]
name = "kernelgecp"
version = "1.0.0"
description = "Reproducible numerical research tools for GECP and the fermionic DLR kernel"
readme = "APPLICATION.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
  "mpmath>=1.3,<2",
  "numpy>=2.0,<3",
  "scipy>=1.14,<2",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.9,<4"]
dev = [
  "hypothesis>=6.100,<7",
  "mypy>=1.11,<2",
  "pip-audit>=2.7,<3",
  "pytest>=9.0.3,<10",
  "ruff>=0.6,<1",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build]
exclude = ["/autonomous-implementation.md"]

[tool.hatch.build.targets.wheel]
packages = ["kernelgecp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["kernelgecp"]

[[tool.mypy.overrides]]
module = ["mpmath", "scipy.*"]
ignore_missing_imports = true
